[package]
name = "mtpoe"
version = "0.1.2"
edition = "2021"
description = "Per-port PoE control for MikroTik RB5009 — force/passive modes beyond 802.3af/at"
license = "GPL-2.0"

[[bin]]
name = "mtpoe"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
crc = "3"
nix = { version = "0.29", features = ["ioctl", "fs"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
