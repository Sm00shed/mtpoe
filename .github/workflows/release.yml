name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set package version and hash
        run: |
          set -e
          HASH=$(git rev-parse HEAD)
          VERSION=$(grep '^PKG_VERSION:=' openwrt/package/utils/mtpoe/Makefile | cut -d= -f2)
          MIRROR_HASH=$(git archive --format=tar --prefix="mtpoe-${VERSION}/" "$HASH" | \
              zstd -T0 --ultra -20 -c | sha256sum | cut -d' ' -f1)
          sed -i \
            -e "s/PKG_SOURCE_VERSION:=HEAD/PKG_SOURCE_VERSION:=$HASH/" \
            -e "s/PKG_MIRROR_HASH:=skip/PKG_MIRROR_HASH:=$MIRROR_HASH/" \
            openwrt/package/utils/mtpoe/Makefile

      - name: Expose package at feed root
        run: mkdir -p utils && ln -s ${{ github.workspace }}/openwrt/package/utils/mtpoe utils/mtpoe

      - name: Build APK
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: aarch64_cortex-a72-SNAPSHOT
          FEEDNAME: mtpoe
          PACKAGES: mtpoe
          NO_REFRESH_CHECK: true

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/aarch64_cortex-a72/mtpoe/mtpoe-*.apk
