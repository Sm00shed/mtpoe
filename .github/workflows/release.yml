name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute source hash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          PKG_HASH=$(curl -fsSL \
            "https://github.com/sm00shed/mtpoe/archive/refs/tags/${TAG}.tar.gz" \
            | sha256sum | cut -d' ' -f1)
          sed -i "s|PKG_HASH:=skip|PKG_HASH:=$PKG_HASH|" \
            openwrt/package/utils/mtpoe/Makefile

      - name: Expose package at feed root
        run: mkdir -p utils && ln -s ${{ github.workspace }}/openwrt/package/utils/mtpoe utils/mtpoe

      - name: Build APK
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: aarch64_cortex-a72-SNAPSHOT
          FEEDNAME: mtpoe
          PACKAGES: mtpoe
          NO_REFRESH_CHECK: true

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/aarch64_cortex-a72/mtpoe/mtpoe-*.apk
